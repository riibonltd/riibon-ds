# Auto-publish the Riibon design system to riibonltd/riibon-ds.
#
# ──────────────────────────────────────────────────────────────────────────
# DORMANT until the riibonltd GitHub Actions billing block is lifted.
# GitHub currently rejects all riibonltd Actions jobs before they run, so
# this workflow would never execute. Until then, publish with the
# one-command local release instead:  (from the riibon-ds repo)
#       npm run release
# ──────────────────────────────────────────────────────────────────────────
#
# TO ACTIVATE (once Actions billing is restored):
#   1. Copy this file to  riibon-ai/.github/workflows/publish-ds.yml
#   2. In riibon-ai repo settings → Secrets → Actions, add
#      RIIBON_DS_PUSH_TOKEN = a fine-grained PAT with Contents: write
#      on the riibonltd/riibon-ds repo.
#   3. Push to main touching any design-system path below → it auto-syncs,
#      rebuilds, version-bumps, tags, and pushes riibon-ds. Consumers
#      (riibon-web) then bump their #vX.Y.Z pin to adopt the change.

name: Publish design system

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "src/index.css"
      - "tailwind.config.ts"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo (riibon-ai)
        uses: actions/checkout@v4
        with:
          path: riibon-ai

      - name: Checkout design-system repo (riibon-ds)
        uses: actions/checkout@v4
        with:
          repository: riibonltd/riibon-ds
          token: ${{ secrets.RIIBON_DS_PUSH_TOKEN }}
          path: riibon-ds
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync + build + publish if changed
        working-directory: riibon-ds
        run: |
          npm ci
          git config user.name "riibon-ds-bot"
          git config user.email "bot@riibon.com"
          # release.mjs syncs from ../riibon-ai, rebuilds, and only bumps+
          # tags+pushes when the design system actually changed.
          npm run release -- ../riibon-ai
